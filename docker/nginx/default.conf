server {
    listen 80;
    root /var/www/public;

    # ⚡ CRITICAL FIX: บอก Nginx ว่าหน้าแรกของโฟลเดอร์คือไฟล์ index.php
    index index.php index.html index.htm;

    # 1. ล็อกด่านแรกของ Nginx ให้ยอมรับ Payload ขนาดใหญ่ (ห้ามลืมตัวนี้เด็ดขาด)
    client_max_body_size 40M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # 2. ⚡ INJECTION: ยิงค่าคอนฟิกส่งตรงไปคุม PHP-FPM โดยตรงโดยไม่ต้องพึ่ง php.ini
        fastcgi_param PHP_VALUE "upload_max_filesize=35M \n post_max_size=40M \n memory_limit=256M \n max_execution_time=300";
        
        fastcgi_read_timeout 300;
    }
}